name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
        poetry-version: ["1.8.5"]
        mint-only-deprecated: ["false", "true"]
        mint-database: ["./test_data/test_mint", "postgres://cashu:cashu@localhost:5432/cashu"]
        backend-wallet-class: ["FakeWallet"]
    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      poetry-version: ${{ matrix.poetry-version }}
      mint-only-deprecated: ${{ matrix.mint-only-deprecated }}
      mint-database: ${{ matrix.mint-database }}

  tests_redis_cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
        poetry-version: ["1.8.5"]
        mint-database: ["./test_data/test_mint", "postgres://cashu:cashu@localhost:5432/cashu"]
    uses: ./.github/workflows/tests_redis_cache.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      poetry-version: ${{ matrix.poetry-version }}
      mint-database: ${{ matrix.mint-database }}

  tests_keycloak_auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
        poetry-version: ["1.8.5"]
        mint-database: ["./test_data/test_mint", "postgres://cashu:cashu@localhost:5432/cashu"]
    uses: ./.github/workflows/tests_keycloak_auth.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      poetry-version: ${{ matrix.poetry-version }}
      mint-database: ${{ matrix.mint-database }}

  monero-regtest:
    uses: ./.github/workflows/monero-regtest.yml

  # The regtest suites drive the Lightning backends through an external harness
  # (callebtc/cashu-regtest-enviroment) that is cloned unpinned at run time. This
  # fork's workflows are older than upstream's, so the current harness no longer
  # works against them, and the failures are all in Lightning payment paths this
  # fork does not use. The workflow files are kept so they can be run manually or
  # re-enabled after syncing CI with upstream.
